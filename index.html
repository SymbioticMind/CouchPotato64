<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couch Potato 64</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">


<header class="header">

<h1 class="logo">
Couch Potato 64
</h1>

<p class="subtitle">
Multiplayer N64 Gaming Experience
</p>

</header>





<!-- PROFILE CREATION -->

<section id="profile-screen" class="screen">


<h2>Create Profile</h2>


<input
id="username-input"
placeholder="Enter Username"
>


<p>
Choose Avatar
</p>


<div id="avatar-options">

<button onclick="selectAvatar('🥔')">
🥔
</button>

<button onclick="selectAvatar('👾')">
👾
</button>

<button onclick="selectAvatar('🤖')">
🤖
</button>

<button onclick="selectAvatar('⭐')">
⭐
</button>

<button onclick="selectAvatar('🕹️')">
🕹️
</button>

</div>



<button onclick="finishProfile()">

Create Profile

</button>


</section>







<!-- HOME -->

<section id="home-screen" class="screen">


<h2 id="welcome-message"></h2>



<button onclick="showScreen('library-screen')">

My Library

</button>



<button onclick="showScreen('friends-screen')">

Friends

</button>



<button onclick="createLobby()">

Host Game

</button>



<button onclick="showScreen('join-screen')">

Join Game

</button>



<button onclick="showScreen('settings-screen')">

Settings

</button>



</section>







<!-- LIBRARY -->

<section id="library-screen" class="screen">


<h2>
My Library
</h2>


<div id="game-library">

<p>
No games added yet.
</p>

</div>



<button onclick="addGame()">

+ Add Game

</button>



<button onclick="showScreen('home-screen')">

Back

</button>


</section>









<!-- FRIENDS -->

<section id="friends-screen" class="screen">


<h2>
Friends
</h2>


<p>
Your Friend Code:
</p>


<h3 id="friend-code-display"></h3>



<button onclick="copyFriendCode()">

Copy Code

</button>



<div id="friends-list">

</div>



<button onclick="showScreen('add-friend-screen')">

Add Friend

</button>



<button onclick="showScreen('home-screen')">

Back

</button>


</section>









<!-- ADD FRIEND -->

<section id="add-friend-screen" class="screen">


<h2>
Add Friend
</h2>



<input
id="friend-code-input"
placeholder="CP64-XXXX-XXXX"
>



<input
id="friend-name-input"
placeholder="Friend Name"
>



<button onclick="submitFriend()">

Add Friend

</button>



<button onclick="showScreen('friends-screen')">

Back

</button>


</section>









<!-- JOIN ROOM -->

<section id="join-screen" class="screen">


<h2>
Join Online Game
</h2>



<input
id="room-code-input"
placeholder="ROOM CODE"
>



<button onclick="joinOnlineGame()">

Join Room

</button>



<button onclick="showScreen('home-screen')">

Back

</button>


</section>









<!-- LOBBY -->

<section id="lobby-screen" class="screen">


<h2>
Online Lobby
</h2>



<p>
Room Code:
</p>


<h3 id="room-code-display">

</h3>




<h3>
Players
</h3>



<div id="lobby-players">

</div>




<button onclick="startGame()">

Start Game

</button>



<button onclick="exitLobby()">

Leave Lobby

</button>


</section>









<!-- SETTINGS -->

<section id="settings-screen" class="screen">


<h2>
Settings
</h2>



<button onclick="changeTheme('launchConsole')">

Launch Console

</button>



<button onclick="changeTheme('midnightCRT')">

Midnight CRT

</button>



<button onclick="changeTheme('arcadeMode')">

Arcade Mode

</button>



<button onclick="showScreen('home-screen')">

Back

</button>


</section>







</main>









<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>





<!-- FIREBASE CONFIG -->

<script src="firebase/config.js"></script>

<script src="firebase/init.js"></script>

<script src="firebase/test.js"></script>








<!-- COUCH POTATO 64 SYSTEMS -->

<script src="js/navigation.js"></script>

<script src="js/library.js"></script>

<script src="js/themes.js"></script>

<script src="js/settings.js"></script>

<script src="js/identity.js"></script>

<script src="js/profile.js"></script>

<script src="js/players.js"></script>

<script src="js/friends.js"></script>

<script src="js/friendsUI.js"></script>

<script src="js/rooms.js"></script>

<script src="js/onlineRooms.js"></script>

<script src="js/presence.js"></script>

<script src="js/lobbyUI.js"></script>


<script src="app.js"></script>



</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Couch Potato 64</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <main class="container">


        <!-- Application Header -->

        <header class="header">

            <h1 class="logo">
                Couch Potato 64
            </h1>


            <p class="subtitle">
                Multiplayer N64 Gaming Experience
            </p>


        </header>



        <!-- ==========================
             HOME SCREEN
        =========================== -->

        <section 
            id="home-screen" 
            class="screen active"
        >


            <button onclick="showScreen('library-screen')">

                My Library

            </button>


            <button onclick="showScreen('host-screen')">

                Host Game

            </button>


            <button onclick="showScreen('join-screen')">

                Join Game

            </button>


            <button onclick="showScreen('settings-screen')">

                Settings

            </button>


        </section>





        <!-- ==========================
             LIBRARY SCREEN
        =========================== -->


        <section 
            id="library-screen" 
            class="screen"
        >


            <h2>
                My Library
            </h2>


            <div id="game-library">

                <p>
                    No games added yet.
                </p>


            </div>


            <button onclick="addGame()">

                + Add Game

            </button>


            <button onclick="showScreen('home-screen')">

                Back

            </button>


        </section>





        <!-- ==========================
             HOST SCREEN
        =========================== -->


        <section 
            id="host-screen" 
            class="screen"
        >


            <h2>
                Host Game
            </h2>


            <p>
                Create an online game room.
            </p>


            <button onclick="createRoom()">

                Create Room

            </button>


            <button onclick="showScreen('home-screen')">

                Back

            </button>


        </section>





        <!-- ==========================
             JOIN SCREEN
        =========================== -->


        <section 
            id="join-screen" 
            class="screen"
        >


            <h2>
                Join Game
            </h2>


            <input
                id="room-code"
                placeholder="Enter Room Code"
            >


            <button onclick="joinRoom()">

                Join Room

            </button>


            <button onclick="showScreen('home-screen')">

                Back

            </button>


        </section>





        <!-- ==========================
             SETTINGS SCREEN
        =========================== -->


        <section 
            id="settings-screen" 
            class="screen"
        >


            <h2>
                Settings
            </h2>


            <p>
                Theme Selection
            </p>


            <button onclick="changeTheme('launchConsole')">

                Launch Console

            </button>


            <button onclick="changeTheme('midnightCRT')">

                Midnight CRT

            </button>


            <button onclick="changeTheme('arcadeMode')">

                Arcade Mode

            </button>


            <button onclick="showScreen('home-screen')">

                Back

            </button>


        </section>



    </main>





    <script src="js/navigation.js"></script>

    <script src="js/library.js"></script>

    <script src="js/themes.js"></script>

    <script src="js/settings.js"></script>

    <script src="app.js"></script>



</body>

</html>

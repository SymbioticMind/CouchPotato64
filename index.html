<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couch Potato 64</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<main class="container">



<header class="header">

<h1 class="logo">
Couch Potato 64
</h1>

<p class="subtitle">
Multiplayer N64 Gaming Experience
</p>

</header>




<!-- PROFILE CREATION -->

<section 
id="profile-screen"
class="screen"
>


<h2>
Create Profile
</h2>


<input
id="username-input"
placeholder="Enter Username"
>


<p>
Choose Avatar
</p>


<div id="avatar-options">


<button onclick="selectAvatar('🥔')">
🥔
</button>


<button onclick="selectAvatar('👾')">
👾
</button>


<button onclick="selectAvatar('🤖')">
🤖
</button>


<button onclick="selectAvatar('⭐')">
⭐
</button>


<button onclick="selectAvatar('🕹️')">
🕹️
</button>


</div>



<button onclick="finishProfile()">

Create Profile

</button>



</section>






<!-- HOME -->

<section
id="home-screen"
class="screen active"
>


<h2 id="welcome-message">

</h2>



<button onclick="showScreen('library-screen')">

My Library

</button>



<button onclick="showScreen('host-screen')">

Host Game

</button>



<button onclick="showScreen('join-screen')">

Join Game

</button>



<button onclick="showScreen('settings-screen')">

Settings

</button>



</section>





<!-- EXISTING SCREENS -->

<section id="library-screen" class="screen">

<h2>
My Library
</h2>

<div id="game-library">

<p>
No games added yet.
</p>

</div>


<button onclick="addGame()">
+ Add Game
</button>


<button onclick="showScreen('home-screen')">
Back
</button>


</section>






<section id="host-screen" class="screen">

<h2>
Host Game
</h2>

<p>
Create a game room.
</p>


<button onclick="createRoom()">
Create Room
</button>


<button onclick="showScreen('home-screen')">
Back
</button>


</section>







<section id="join-screen" class="screen">

<h2>
Join Game
</h2>


<input
id="room-code"
placeholder="Room Code"
>


<button onclick="joinRoom()">
Join Room
</button>


<button onclick="showScreen('home-screen')">
Back
</button>


</section>







<section id="settings-screen" class="screen">

<h2>
Settings
</h2>


<button onclick="changeTheme('launchConsole')">
Launch Console
</button>


<button onclick="changeTheme('midnightCRT')">
Midnight CRT
</button>


<button onclick="changeTheme('arcadeMode')">
Arcade Mode
</button>


<button onclick="showScreen('home-screen')">
Back
</button>


</section>






</main>





<script src="js/navigation.js"></script>

<script src="js/library.js"></script>

<script src="js/themes.js"></script>

<script src="js/settings.js"></script>

<script src="js/profile.js"></script>

<script src="js/players.js"></script>

<script src="app.js"></script>



</body>

</html>
